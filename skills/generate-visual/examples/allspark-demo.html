<script>
(function () {

  }

  // Shared glow texture

  }

  // Star field ("second brain" background)

    for (var i = 0; i < n; i++) {

      pos[i * 3] = r * Math.sin(f) * Math.cos(t); pos[i * 3 + 1] = r * Math.cos(f); pos[i * 3 + 2] = r * Math.sin(f) * Math.sin(t);
    }
    var geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    var mat = new THREE.PointsMaterial({ size: 0.9, map: GLOW, color: 0x9fb0ff, transparent: true, opacity: 0.42,

    var stars = new THREE.Points(geo, mat); stars.name = 'stars'; scene.add(stars);

  cube.add(frame);
  var grid = new THREE.GridHelper(2 * S, 10, 0x3a4697, 0x27306b);

  var ORIGIN = new THREE.Vector3(-S, -S, -S);
  var visualAxes = ['pos_x', 'pos_y', 'pos_z'].map(function (field, i) {
    var sem = axes[field]; var color = COLOR_SEMANTIC[sem] || 0xffffff;
    var end = ORIGIN.clone(); end.setComponent(i, S + 0.6);

    if (h.kind === 'data') {
      if (e.entities && e.entities.length) rows.push(['Entities', e.entities.join(', ')]);
      if (e.operations && e.operations.length) rows.push(['Operations', e.operations.join(', ')]);
    }
    tipBox(e.method + ' ' + e.route, 'Endpoint · click to isolate', rows, ev);
  }
  canvas.addEventListener('pointermove', function (ev) {
    readPointer(ev); hover = pickAll(); canvas.style.cursor = hover ? 'pointer' : 'grab';
    if (!hover) tip.hidden = true; else if (hover.strand) showStrandTip(hover, ev); else showTip(hover.node, ev);
  });
  canvas.addEventListener('pointerleave', function () { tip.hidden = true; });
  var down = null;
  canvas.addEventListener('pointerdown', function (ev) { down = { x: ev.clientX, y: ev.clientY }; });
  canvas.addEventListener('pointerup', function (ev) {
    if (!down || Math.hypot(ev.clientX - down.x, ev.clientY - down.y) > 5) return;
    readPointer(ev); var hit = pickAll(); stopTour();
    if (mode === 'detail') {   // in the Detail view a click isolates a strand; clicking the void shows all of them again
      if (hit && hit.strand) isolate(hit.strand.ep); else if (!hit) { activeEp = null; syncUI(); }
      return;
    }
    closeStrands(); mode = 'global'; activeModule = null;
    selection = (hit && hit.node && hit.node !== selection) ? hit.node : null; applySelection();
  });
  window.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { back(); tip.hidden = true; }
  });

  function resize() {
    var width = window.innerWidth, height = window.innerHeight;
    renderer.setSize(width, height, false); camera.aspect = width / height;
    camera.fov = width < 720 ? 52 : 40; camera.updateProjectionMatrix();
    computeDistances(camera.aspect, camera.fov);
    if (composer) { composer.setSize(width, height); bloom.resolution.set(width, height); }
  }
  window.addEventListener('resize', resize); resize();

  // ---------- 10. Loop ----------
  var phaseTxt = $('#phase-text'), phaseBar = $('#phase-bar'), currentPhase = -1;
  function loop() {
    var dt = Math.min(0.05, clock.getDelta()), now = clock.elapsedTime;
    if (building) {
      tBuild += dt; applyAll(tBuild);
      if (guided) {
        var cl = currentKey(tBuild), f = 1 - Math.exp(-dt * 2.2);
        camTarget.lerp(cl.target, f);
        camDist += (FINAL_DIST * cl.fraction - camDist) * f;
        placeCamera();
      }
      var f = -1; for (var i = 0; i < phases.length; i++) if (tBuild >= phases[i].start) f = i;
      if (f !== currentPhase && f >= 0) { currentPhase = f; phaseTxt.textContent = phases[f].text; }
      phaseBar.style.width = Math.min(100, 100 * tBuild / DURATION) + '%';
      if (tBuild >= DURATION) { finishBuild(); if (modules.length && !reduced) startTour(); }
    }
    if (tour && !building) {
      tour.t += dt;
      if (tour.t > TOUR_HOLD) { tour.t = 0; tour.i++; if (tour.i >= modules.length) clearFocus(); else setModule(modules[tour.i], true); }
    }
    if (camTween && !building) {
      var ft = 1 - Math.exp(-dt * 2.4), dir = camera.position.clone().sub(controls.target), d0 = dir.length();
      dir.normalize(); controls.target.lerp(camTween.target, ft);
      camera.position.copy(controls.target).add(dir.multiplyScalar(d0 + (camTween.dist - d0) * ft));
      if (controls.target.distanceTo(camTween.target) < 0.02 && Math.abs(d0 - camTween.dist) < 0.1) camTween = null;
    }
    if (sway && !reduced && !building) { // gentle oscillation: never flips the client → external reading
      tSway += dt;
      var ang = Math.sin(tSway * 0.18) * 0.32, len = camera.position.distanceTo(controls.target);
      var d = CAM_DIR.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), ang);
      camera.position.copy(controls.target).add(d.multiplyScalar(len));
    }
    if (!reduced) vectors.forEach(function (o) {
      if (!o.active || !o.core.visible) { o.pulse.material.opacity = 0; return; }
      var vel = 0.9 / Math.max(2, o.length) * (o.weak ? 0.5 : 1);
      var u = (now * vel * 3 + o.phase) % 1;
      o.pulse.position.copy(o.curve.getPointAt(u * o.tArrow));
      var on = !focus.vecs || focus.vecs.has(o);
      o.pulse.material.opacity = (on ? 0.7 : 0.05) * Math.sin(Math.PI * u);
    });
    if (!reduced) nodes.forEach(function (n) {   // electrons orbiting the nuclei, slowly
      if (n.electrons && n.group.scale.x > 0.05) n.electrons.forEach(function (e) { e.pivot.rotation.y += dt * e.speed; });
    });
    modules.forEach(function (mo) {   // module trails: drawn progressively, with a travelling light and numbered badges
      var want = mo.target > 0;
      if (mo.path) mo.core.visible = mo.halo.visible = mo.pulse.visible = want;
      if (!want) { if (mo.path) mo.pulse.material.opacity = 0; mo.badges.forEach(function (bd) { bd.visible = false; }); return; }
      if (mo.k < 1) mo.k = Math.min(1, mo.k + dt / (reduced ? 0.01 : 2.2));
      var kk = smooth(mo.k);
      if (mo.path) {
        var n = Math.ceil(kk * mo.seg) * mo.rad * 6;
        mo.core.geometry.setDrawRange(0, n); mo.halo.geometry.setDrawRange(0, n);
        mo.core.material.opacity = 0.95; mo.halo.material.opacity = 0.2;
        var u = (now * 3 / Math.max(4, mo.length) + mo.phase) % 1;
        mo.pulse.position.copy(mo.path.getPointAt(Math.min(0.999, u * kk)));
        mo.pulse.material.opacity = 0.95 * Math.sin(Math.PI * u);
      }
      mo.badges.forEach(function (bd) { bd.visible = true; bd.material.opacity = Math.max(0, Math.min(1, (kk - bd.userData.at) * 10 + (mo.path ? 0 : 1))); });
    });
    strands.forEach(function (st) {   // endpoint strands: drawn hop by hop, then a light walks them in order
      if (st.k < 1) st.k = Math.min(1, st.k + dt / (reduced ? 0.01 : 1.6));
      var N = st.hops.length, kk = smooth(st.k), dimmed = !!activeEp && activeEp !== st.ep;
      st.hops.forEach(function (hh, i) {
        var kh = Math.max(0, Math.min(1, kk * N - i)), cnt = Math.ceil(kh * hh.seg) * hh.rad * 6;
        hh.core.geometry.setDrawRange(0, cnt); hh.halo.geometry.setDrawRange(0, cnt);
        hh.core.material.opacity = dimmed ? 0.12 : 0.95; hh.halo.material.opacity = dimmed ? 0.02 : 0.18;
      });
      var pos = ((now * 0.3 + st.phase) % 1) * N, i = Math.min(N - 1, Math.floor(pos)), fr = pos - i;
      st.spark.position.copy(st.hops[i].curve.getPointAt(Math.min(0.999, fr)));
      st.spark.material.opacity = (dimmed || kk < 0.98) ? 0 : 0.95 * Math.sin(Math.PI * fr);
    });
    var st = scene.getObjectByName('stars'); if (st && !reduced) st.rotation.y += dt * 0.004;
    controls.update();
    if (composer) composer.render(); else renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }

    applyAll(0);
    if (reduced) finishBuild();
    requestAnimationFrame(loop);
  } // end of main()

  // Wait for the label font (max. 1.2 s) before building the scene, so the 3D text does not use the fallback font
  var ready = false; function once() { if (!ready) { ready = true; main(); } }
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('600 64px "Chakra Petch"'), document.fonts.load('500 64px "Chakra Petch"')]).then(once, once);
    setTimeout(once, 1200);
  } else once();
})();
</script>
</body>
